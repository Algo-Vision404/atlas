name: ATLAS CI

on:
  push:
    branches: ["main", "refine/**", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Compile
        run: python -m compileall apps libs services
      - name: Test
        run: pytest -q
