[project]
name = "atlas-system"
version = "0.2.0"
description = "Distributed Web Crawl & Indexing CLI Engine"
authors = [
    { name = "Atlas Team", email = "engineering@atlas-engine.io" }
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "qdrant-client>=1.16.0",
    "opensearch-py>=2.2.0",
    "neo4j>=5.10.0",
    "kafka-python-ng>=2.2.0",
    "redis>=4.5.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "libs*", "services*"]

[project.scripts]
atlas = "apps.cli.main:app"
